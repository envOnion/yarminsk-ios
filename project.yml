name: YarMinsk
options:
  bundleIdPrefix: by.yarminsk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.8.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0

targets:
  YarMinsk:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    entitlements:
      path: Configuration/YarMinsk.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: by.yarminsk.app
      PRODUCT_NAME: YarMinsk
      INFOPLIST_FILE: Resources/Info.plist
      SWIFT_VERSION: "5.0"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 2W876M34X7
  YarMinskTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: YarMinsk
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.0"

schemes:
  YarMinsk:
    build:
      targets:
        YarMinsk: all
    test:
      targets: [YarMinskTests]
  YarMinskLiveAuth:
    build:
      targets:
        YarMinsk: all
    test:
      targets: [YarMinskTests]
      environmentVariables:
        YAR_FIREBASE_LIVE_TEST: "1"
